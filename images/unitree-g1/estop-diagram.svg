<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%" style="background:#0d0e12; border-radius:8px; font-family:'Share Tech Mono', monospace, sans-serif;">
  <defs>
    <!-- Grid Pattern like draw.io -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#eab308"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <rect x="24" y="20" width="932" height="44" rx="6" fill="#161822" stroke="#262a3b" stroke-width="1.5"/>
  <text x="42" y="47" fill="#f3f4f6" font-size="15" font-weight="bold" letter-spacing="1.5">HARDWARE RELAY E-STOP SCHEMATIC &amp; WIRING FLOW</text>
  <text x="630" y="47" fill="#9ca3af" font-size="12" letter-spacing="1">UNITREE G1 DUAL-TRIGGER SAFETY SYSTEM</text>

  <!-- ==================== 1. POWER SUPPLY (XT30) ==================== -->
  <g transform="translate(40, 95)">
    <rect width="190" height="110" rx="6" fill="#181a20" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#854d0e" />
    <rect x="0" y="20" width="190" height="8" fill="#854d0e" />
    <text x="95" y="19" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">12V AUX POWER</text>
    <text x="95" y="54" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">G1 Robot 12V Port</text>
    <rect x="45" y="68" width="100" height="22" rx="3" fill="#eab308" />
    <text x="95" y="83" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">XT30 Connector</text>
    <text x="95" y="102" fill="#a1a1aa" font-size="10" text-anchor="middle">Direct battery bus</text>
  </g>

  <!-- ==================== 2. RF REMOTES ==================== -->
  <g transform="translate(40, 240)">
    <rect width="190" height="130" rx="6" fill="#181a20" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#0e7490" />
    <rect x="0" y="20" width="190" height="8" fill="#0e7490" />
    <text x="95" y="19" fill="#cffafe" font-size="12" font-weight="bold" text-anchor="middle">WIRELESS TRANSMITTERS</text>
    <text x="95" y="54" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2x RF Remote Controls</text>
    <rect x="35" y="66" width="120" height="20" rx="3" fill="#083344" stroke="#0891b2" stroke-width="1"/>
    <text x="95" y="80" fill="#22d3ee" font-size="10" text-anchor="middle">433 MHz RF Carrier</text>
    <text x="95" y="102" fill="#cbd5e1" font-size="10" text-anchor="middle">Handheld operator fobs</text>
    <text x="95" y="118" fill="#94a3b8" font-size="9" text-anchor="middle">Instant toggle / latch mode</text>
  </g>

  <!-- ==================== 3. RF RELAY LATCH ==================== -->
  <g transform="translate(290, 115)">
    <rect width="200" height="160" rx="6" fill="#12151d" stroke="#0891b2" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#0e7490" />
    <rect x="0" y="20" width="200" height="8" fill="#0e7490" />
    <text x="100" y="19" fill="#cffafe" font-size="12" font-weight="bold" text-anchor="middle">RF RELAY LATCH MODULE</text>
    <text x="100" y="50" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">12V Wireless Relay Board</text>

    <!-- Power Inputs -->
    <rect x="12" y="65" width="80" height="26" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="52" y="77" fill="#eab308" font-size="9" font-weight="bold" text-anchor="middle">VCC (+12V)</text>
    <text x="52" y="87" fill="#64748b" font-size="8" text-anchor="middle">GND (Return)</text>

    <!-- Dry Contacts -->
    <rect x="108" y="65" width="80" height="26" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="148" y="77" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">RELAY DRY OUT</text>
    <text x="148" y="87" fill="#94a3b8" font-size="8" text-anchor="middle">COM &amp; NO Ports</text>

    <!-- State Description -->
    <rect x="12" y="102" width="176" height="46" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="118" fill="#7dd3fc" font-size="9.5" font-weight="bold" text-anchor="middle">NORMAL: Circuit Open</text>
    <text x="100" y="132" fill="#bae6fd" font-size="9" text-anchor="middle">RF Remote Triggered →</text>
    <text x="100" y="143" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">RELAY LATCHES CLOSED</text>
  </g>

  <!-- ==================== 4. HEAD-MOUNTED E-STOP BUTTON ==================== -->
  <g transform="translate(290, 360)">
    <rect width="200" height="140" rx="6" fill="#1a1215" stroke="#ef4444" stroke-width="1.5" filter="url(#glow-red)"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#b91c1c" />
    <rect x="0" y="20" width="200" height="8" fill="#b91c1c" />
    <text x="100" y="19" fill="#fee2e2" font-size="12" font-weight="bold" text-anchor="middle">PHYSICAL HEAD E-STOP</text>
    <circle cx="100" cy="66" r="20" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <circle cx="100" cy="66" r="10" fill="#dc2626"/>
    <text x="100" y="70" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">STOP</text>
    <text x="100" y="104" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">Red Pushbutton Mushroom</text>
    <text x="100" y="120" fill="#f87171" font-size="9.5" text-anchor="middle">Mounted on G1 Skull Bracket</text>
    <text x="100" y="132" fill="#991b1b" font-size="8.5" text-anchor="middle">Mechanical Twist-to-Reset</text>
  </g>

  <!-- ==================== 5. WAGO 221 SPLICING CLIPS ==================== -->
  <g transform="translate(540, 200)">
    <rect width="170" height="210" rx="6" fill="#181a20" stroke="#f97316" stroke-width="1.5" filter="url(#glow-orange)"/>
    <rect x="0" y="0" width="170" height="28" rx="6" fill="#c2410c" />
    <rect x="0" y="20" width="170" height="8" fill="#c2410c" />
    <text x="85" y="19" fill="#ffedd5" font-size="11" font-weight="bold" text-anchor="middle">2x WAGO 221 SPLICES</text>

    <!-- WAGO Clip A -->
    <rect x="15" y="42" width="140" height="65" rx="4" fill="#27272a" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="22" y="48" width="28" height="14" rx="2" fill="#f97316"/>
    <rect x="54" y="48" width="28" height="14" rx="2" fill="#f97316"/>
    <rect x="86" y="48" width="28" height="14" rx="2" fill="#f97316"/>
    <text x="85" y="78" fill="#fed7aa" font-size="10" font-weight="bold" text-anchor="middle">WAGO A (Line 1)</text>
    <text x="85" y="94" fill="#9ca3af" font-size="8.5" text-anchor="middle">Relay COM + Button Pin 1</text>

    <!-- WAGO Clip B -->
    <rect x="15" y="122" width="140" height="65" rx="4" fill="#27272a" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="22" y="128" width="28" height="14" rx="2" fill="#f97316"/>
    <rect x="54" y="128" width="28" height="14" rx="2" fill="#f97316"/>
    <rect x="86" y="128" width="28" height="14" rx="2" fill="#f97316"/>
    <text x="85" y="158" fill="#fed7aa" font-size="10" font-weight="bold" text-anchor="middle">WAGO B (Line 2)</text>
    <text x="85" y="174" fill="#9ca3af" font-size="8.5" text-anchor="middle">Relay NO + Button Pin 2</text>
  </g>

  <!-- ==================== 6. G1 PC 1 (GH CONNECTOR) ==================== -->
  <g transform="translate(750, 160)">
    <rect width="200" height="280" rx="6" fill="#141722" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#1d4ed8" />
    <rect x="0" y="20" width="200" height="8" fill="#1d4ed8" />
    <text x="100" y="19" fill="#dbeafe" font-size="12" font-weight="bold" text-anchor="middle">G1 PC 1 INTERFACE</text>

    <text x="100" y="54" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">G1 Onboard PC 1</text>
    <rect x="25" y="68" width="150" height="24" rx="3" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="100" y="84" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">GH 1.25mm Connector</text>

    <!-- Logic Box -->
    <rect x="15" y="106" width="170" height="155" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="100" y="126" fill="#a5b4fc" font-size="11" font-weight="bold" text-anchor="middle">SAFETY FSM TRIGGER</text>

    <text x="100" y="148" fill="#e0e7ff" font-size="10" text-anchor="middle">Normally Open (Floating)</text>
    <text x="100" y="162" fill="#4ade80" font-size="9" font-weight="bold" text-anchor="middle">→ Normal Walking State</text>

    <path d="M 30 174 L 170 174" stroke="#4338ca" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="100" y="192" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">SHORT CIRCUIT (0 Ω):</text>
    <text x="100" y="208" fill="#f87171" font-size="9.5" text-anchor="middle">Permanent Damped Mode</text>
    <text x="100" y="224" fill="#ef4444" font-size="9.5" font-weight="bold" text-anchor="middle">Immediate Motor Torque = 0</text>
    <text x="100" y="240" fill="#fed7aa" font-size="9" text-anchor="middle">Robot safely falls / slumps</text>
    <text x="100" y="252" fill="#fed7aa" font-size="8.5" text-anchor="middle">Caught safely on gantry tether</text>
  </g>

  <!-- ==================== WIRING / TRACES ==================== -->

  <!-- 12V Power: XT30 -> RF Relay -->
  <path d="M 230 150 L 260 150 L 260 180 L 290 180" fill="none" stroke="#eab308" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <text x="260" y="142" fill="#fef08a" font-size="9.5" font-weight="bold" text-anchor="middle">+12V / GND (XT30)</text>

  <!-- RF Link: Remotes -> Relay -->
  <path d="M 230 305 L 260 305 L 260 220 L 290 220" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-cyan)"/>
  <text x="252" y="266" fill="#67e8f9" font-size="9" text-anchor="middle" transform="rotate(-90 252 266)">433 MHz RF</text>

  <!-- RF Relay -> WAGO A (COM) -->
  <path d="M 490 180 L 515 180 L 515 270 L 540 270" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- RF Relay -> WAGO B (NO) -->
  <path d="M 490 200 L 505 200 L 505 350 L 540 350" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Head E-Stop -> WAGO A -->
  <path d="M 490 410 L 515 410 L 515 290 L 540 290" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Head E-Stop -> WAGO B -->
  <path d="M 490 440 L 525 440 L 525 370 L 540 370" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- WAGO A -> G1 PC 1 GH Pin 1 -->
  <path d="M 710 270 L 730 270 L 730 230 L 750 230" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="730" y="222" fill="#fdba74" font-size="9" font-weight="bold" text-anchor="middle">GH Pin 1</text>

  <!-- WAGO B -> G1 PC 1 GH Pin 2 -->
  <path d="M 710 350 L 730 350 L 730 250 L 750 250" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="730" y="262" fill="#fdba74" font-size="9" font-weight="bold" text-anchor="middle">GH Pin 2</text>

  <!-- Bottom Legend / Info -->
  <rect x="24" y="520" width="932" height="44" rx="4" fill="#111319" stroke="#1f2430"/>
  <circle cx="45" cy="542" r="5" fill="#eab308"/>
  <text x="58" y="546" fill="#e2e8f0" font-size="10.5">12V DC Power Bus</text>

  <circle cx="185" cy="542" r="5" fill="#06b6d4"/>
  <text x="198" y="546" fill="#e2e8f0" font-size="10.5">RF Wireless Latch Trigger</text>

  <circle cx="370" cy="542" r="5" fill="#ef4444"/>
  <text x="383" y="546" fill="#e2e8f0" font-size="10.5">Physical Red Mushroom Switch</text>

  <circle cx="580" cy="542" r="5" fill="#f97316"/>
  <text x="593" y="546" fill="#e2e8f0" font-size="10.5">WAGO Parallel Splice Bus</text>

  <circle cx="770" cy="542" r="5" fill="#3b82f6"/>
  <text x="783" y="546" fill="#e2e8f0" font-size="10.5">G1 Permanent Damped Mode</text>
</svg>