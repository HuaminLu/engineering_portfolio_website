<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- black tile, white microchip + circuit traces — matches the site theme -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <!-- chip body -->
  <rect x="20" y="20" width="24" height="24" rx="3" fill="none" stroke="#f2f2f2" stroke-width="3"/>
  <rect x="27" y="27" width="10" height="10" rx="1.5" fill="#f2f2f2"/>
  <!-- pins: top & bottom -->
  <g stroke="#f2f2f2" stroke-width="3" stroke-linecap="round">
    <path d="M26 20 V12"/><path d="M32 20 V10"/><path d="M38 20 V12"/>
    <path d="M26 44 V52"/><path d="M32 44 V54"/><path d="M38 44 V52"/>
    <!-- pins: left & right -->
    <path d="M20 26 H12"/><path d="M20 32 H10"/><path d="M20 38 H12"/>
    <path d="M44 26 H52"/><path d="M44 32 H54"/><path d="M44 38 H52"/>
  </g>
  <!-- solder pads at trace ends -->
  <g fill="#f2f2f2">
    <circle cx="32" cy="10" r="2.6"/><circle cx="32" cy="54" r="2.6"/>
    <circle cx="10" cy="32" r="2.6"/><circle cx="54" cy="32" r="2.6"/>
  </g>
</svg>
